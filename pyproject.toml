[project]
name = "cloud-discord-mcp"
version = "0.1.0"
description = "A locked-down cloud Discord bot exposed through MCP"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.4,<3",
  "mcp[cli]>=1.14,<2",
  "starlette>=0.37,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
cloud-discord-mcp = "discord_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

